[package]
name = "perspektive-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Jose Ricardo Figueroa Junior", "Antigravity"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
nalgebra = { version = "0.32", features = ["serde-serialize"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for small size and high performance
opt-level = "s"
lto = true
